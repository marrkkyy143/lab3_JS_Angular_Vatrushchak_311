<div class="container mt-5">

  @if (loading()) {
    <p>Loading product...</p>
  } @else if (error()) {
    <div class="alert alert-danger">
      {{ error() }}
    </div>
  } @else if (product(); as item) {

    <div class="row">
      <div class="col-md-5">
        <img
          [src]="item.image"
          [alt]="item.title"
          class="img-fluid"
          style="max-height: 400px; object-fit: contain;"
        >
      </div>

      <div class="col-md-7">
        <h2>{{ item.title }}</h2>

        <p class="text-muted">
          Category: {{ item.category }}
        </p>

        <h4 class="text-primary">
          ${{ item.price }}
        </h4>

        <p>{{ item.description }}</p>

        <a routerLink="/products" class="btn btn-secondary">
          Back to Products
        </a>

        <a
          [routerLink]="['/edit-product', item.id]"
          class="btn btn-warning ms-2"
        >
          Edit Product
        </a>
      </div>
    </div>

  }
</div>
